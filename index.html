<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base target="_top" />
  <title>Advanced Attendance & Location Management System</title>
  
  <!-- CSS Libraries -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- DataTables: core + Bootstrap 5 styling + Buttons (CSV/PDF/Print) + Responsive -->
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet"/>
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet"/>
  <link href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css" rel="stylesheet"/>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="assets/styles/base.css" />
  <link rel="stylesheet" href="assets/styles/login.css" />
  <link rel="stylesheet" href="assets/styles/layout.css" />
  <link rel="stylesheet" href="assets/styles/views.css" />
  <link rel="stylesheet" href="assets/styles/components.css" />
  <link rel="stylesheet" href="assets/styles/live-map.css" />
  <link rel="stylesheet" href="assets/styles/preferences.css" />
  <link rel="stylesheet" href="assets/styles/payroll.css" />
  <link rel="stylesheet" href="assets/styles/tables.css" />
  <link rel="stylesheet" href="assets/styles/popup.css" />
  <link rel="stylesheet" href="assets/styles/print.css" />
  <link rel="stylesheet" href="assets/styles/loading.css" />
  <link rel="stylesheet" href="assets/styles/responsive.css" />
</head>
<body style="visibility:hidden;">
  <div id="app-root"></div>

  <!-- JavaScript Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- DataTables JS — must load AFTER jQuery -->
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <script>
    (function () {
      function loadScripts(paths) {
        return paths.reduce(function (chain, src) {
          return chain.then(function () {
            return new Promise(function (resolve, reject) {
              var script = document.createElement('script');
              script.src = src;
              script.onload = resolve;
              script.onerror = function () { reject(new Error('Could not load ' + src)); };
              document.body.appendChild(script);
            });
          });
        }, Promise.resolve());
      }
      fetch('assets/partials/app-shell.html')
        .then(function (res) { if (!res.ok) throw new Error('Could not load app shell'); return res.text(); })
        .then(function (html) {
          document.getElementById('app-root').innerHTML = html;
          return loadScripts(['assets/js/popup.js', 'assets/js/api.js', 'assets/js/config.js', 'assets/js/charts.js', 'assets/app.js']);
        })
        .then(function () {
          // reveal only after init() has decided which screen to show — eliminates login flash
          document.body.style.visibility = '';
        })
        .catch(function (err) {
          document.body.style.visibility = '';
          document.getElementById('app-root').innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#b00020;">Failed to load application shell.</div>';
          console.error(err);
        });
    })();
  </script>
</body>
</html>
