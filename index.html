  <!-- Preload profile image as early as possible — runs before any CSS/JS so
       the image is decoded by the time the app renders, eliminating the
       initial-letter → photo flash on page refresh. -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('siomac_session_v1');
        if (!raw) return;
        var s = JSON.parse(raw);
        if (!s || !s.profileImage || s.expiresAt < Date.now()) return;
        var url = s.profileImage;
        // <link rel="preload"> tells the browser to fetch + decode the image
        // at highest priority, in parallel with the rest of the page load.
        var link = document.createElement('link');
        link.rel  = 'preload';
        link.as   = 'image';
        link.href = url;
        document.head.appendChild(link);
        // Also prime the browser image cache with an off-screen Image object
        // so it is guaranteed decoded before any paint.
        var img = new Image();
        img.src = url;
        // Store on window so applySession can check decode status instantly
        window._preloadedProfileImage = img;
        window._preloadedProfileUrl   = url;
      } catch (_) {}
    })();
  </script>

  <script>(function(){try{var t=localStorage.getItem('siomac-theme');if(t==='dark')document.body.setAttribute('data-theme','dark');}catch(_){}})();</script>

  <!-- Register Service Worker as early as possible — before app scripts load -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(function (reg) {
          // If a waiting SW exists, prompt it to activate immediately
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (nw) nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                nw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        })
        .catch(function (e) { console.warn('[SW] Registration failed:', e); });
    }
  </script>

  <!-- Global error catcher — surfaces any JS crash as a visible banner -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('GLOBAL ERROR:', e.message, 'at', e.filename, e.lineno, e.colno, e.error);
      var banner = document.getElementById('_errBanner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = '_errBanner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#b00020;color:#fff;padding:10px 16px;font-family:monospace;font-size:13px;white-space:pre-wrap;';
        document.body.appendChild(banner);
      }
      banner.textContent = (banner.textContent ? banner.textContent + '\n' : '') +
        'JS ERROR: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')';
      document.body.style.visibility = '';
    });
  </script>
