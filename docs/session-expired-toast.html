<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIOMAC — Session Expired Toast (standalone)</title>
<!--
  Faithful, self-contained extract of the SIOMAC "session expired" toast.
  Markup + classes are the cpop engine's (_showToast in src/lib/popup.ts);
  CSS is the .cpop-toast block from assets/styles/popup.css; all design
  tokens are inlined in :root so this file renders with zero dependencies.
  Click the card (or the button) to replay the enter + timer animation.
-->
<style>
  :root {
    /* SIOMAC design tokens (from assets/styles/base.css) */
    --bg-card:      #FFFFFF;
    --border:       #E9EEF3;
    --text-muted:   #5E6F8D;
    --radius-md:    16px;
    --siomac-navy:  #1b2d54;
    --siomac-red:   #E40C0C;
    --success:      #2E7D32;
    --warning:      #C67C00;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    /* soft app-like backdrop so the white card reads */
    background: radial-gradient(1200px 600px at 80% -10%, #eaf0f8, #dfe6ef 60%, #d7dfe9);
    color: var(--siomac-navy);
  }
  .stage { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .replay {
    padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--siomac-navy); color: #fff; font: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .replay:hover { background: #263a68; }

  /* ── cpop toast (from assets/styles/popup.css) ───────────────────────────── */
  .cpop-toasts { position: fixed; z-index: 100000; pointer-events: none; padding: 16px; max-width: 360px; }
  .cpop-toasts[data-pos="top-end"]      { top: 0; right: 0; }
  .cpop-toasts[data-pos="top-start"]    { top: 0; left: 0; }
  .cpop-toasts[data-pos="bottom-end"]   { bottom: 0; right: 0; }
  .cpop-toasts[data-pos="bottom-start"] { bottom: 0; left: 0; }

  .cpop-toast {
    background: var(--bg-card);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 28px rgba(0,0,0,.14);
    border: 1px solid var(--border);
    padding: 12px 14px 14px;
    margin-bottom: 10px;
    display: flex; gap: 12px; align-items: flex-start;
    pointer-events: auto;
    transform: translateX(120%); opacity: 0;
    transition: transform .25s, opacity .25s;
    position: relative; overflow: hidden;
  }
  .cpop-toast.cpop-toast-in  { transform: translateX(0); opacity: 1; }
  .cpop-toast.cpop-toast-out { transform: translateX(120%); opacity: 0; }

  .cpop-toast-icon {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .cpop-toast-icon svg { width: 18px; height: 18px; stroke-width: 4; fill: none; }

  .cpop-toast.cpop-toast-success  .cpop-toast-icon { background: rgba(46,125,50,.12); }
  .cpop-toast.cpop-toast-success  .cpop-toast-icon svg { stroke: var(--success); }
  .cpop-toast.cpop-toast-error    .cpop-toast-icon { background: rgba(228,12,12,.12); }
  .cpop-toast.cpop-toast-error    .cpop-toast-icon svg { stroke: var(--siomac-red); }
  .cpop-toast.cpop-toast-warning  .cpop-toast-icon { background: rgba(198,124,0,.14); }
  .cpop-toast.cpop-toast-warning  .cpop-toast-icon svg { stroke: var(--warning); }
  .cpop-toast.cpop-toast-info     .cpop-toast-icon { background: rgba(27,45,85,.1); color: var(--siomac-navy); }
  .cpop-toast.cpop-toast-info     .cpop-toast-icon svg { stroke: var(--siomac-navy); }

  .cpop-toast-body  { flex: 1; min-width: 0; }
  .cpop-toast-title { font-size: 13px; font-weight: 600; color: var(--siomac-navy); margin-bottom: 2px; line-height: 1.3; }
  .cpop-toast-text  { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  .cpop-toast-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--siomac-navy); width: 100%; }
  .cpop-toast.cpop-toast-success .cpop-toast-bar { background: var(--success); }
  .cpop-toast.cpop-toast-error   .cpop-toast-bar { background: var(--siomac-red); }
  .cpop-toast.cpop-toast-warning .cpop-toast-bar { background: var(--warning); }

  /* Demo-only: the app animates the bar via JS; here a keyframe shows the 4s timer. */
  .cpop-toast.cpop-toast-in .cpop-toast-bar { animation: cpop-toast-timer 4s linear forwards; }
  @keyframes cpop-toast-timer { from { width: 100%; } to { width: 0%; } }
</style>
</head>
<body>
  <div class="stage">
    <button class="replay" id="replay" type="button">Replay session-expired toast</button>
  </div>

  <!-- Toast stack, top-right — exactly as cpop mounts it -->
  <div class="cpop-toasts" data-pos="top-end" id="toasts">
    <div class="cpop-toast cpop-toast-info" id="toast">
      <div class="cpop-toast-icon">
        <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
          <circle cx="26" cy="26" r="22"></circle>
          <circle cx="26" cy="16" r="1.5" fill="currentColor" stroke="none"></circle>
          <line x1="26" y1="22" x2="26" y2="38" stroke-linecap="round"></line>
        </svg>
      </div>
      <div class="cpop-toast-body">
        <div class="cpop-toast-title">Session Expired</div>
        <div class="cpop-toast-text">Please log in again.</div>
      </div>
      <div class="cpop-toast-bar"></div>
    </div>
  </div>

  <script>
    // Mirrors _showToast: add .cpop-toast-in on the next frame to trigger the
    // slide-in, then let the timer bar run. This is purely to demo the motion.
    const toast = document.getElementById('toast');
    function play() {
      toast.classList.remove('cpop-toast-in');
      // force reflow so the animation restarts
      void toast.offsetWidth;
      requestAnimationFrame(() => toast.classList.add('cpop-toast-in'));
    }
    document.getElementById('replay').addEventListener('click', play);
    play();
  </script>
</body>
</html>
