<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="widget-package-name" content="My Widget Pack">
<meta name="widget-package-version" content="1.0.0">
<style>
/* ===========================================================================
   WIDGET SCALE SYSTEM — every card is a small responsive "app" that FILLS its
   board cell and scales as ONE object. Follow these rules and every widget gets
   the same predictable resize behaviour:

     1. The card root fills its cell:  width:100%; height:100%; box-sizing:border-box
     2. ONE scale token:  --s: 1vmin;  size EVERYTHING in calc(var(--s) * N)
        (vmin = 1% of the cell's smaller side → grows/shrinks with the widget)
     3. NO clamp() caps, NO fixed px — they break uniform scaling
        (clamp caps text so the chart keeps scaling but the text stops → inconsistent)
     4. Fixed budget so the visual never gets crushed:
          .mw-head   { flex:none }            ~20–25%
          .mw-stage  { flex:1; min-height:0 } ~45–60%   (the chart / gauge / number)
          .mw-footer { flex:none }            ~20–30%
     5. Charts: a proportional stage (chart box on top, axis BELOW it).
     6. Gauges / donuts / rings: a container with aspect-ratio holds the SVG.
     7. Reflow for very wide / very tall cells with @media (aspect-ratio).
   =========================================================================== */
*{box-sizing:border-box}

.mw-card{
  width:100%; height:100%; box-sizing:border-box; overflow:hidden;
  display:flex; flex-direction:column;
  --s:1vmin;                                 /* the single scale token */
  padding:calc(var(--s) * 5);
  gap:calc(var(--s) * 2);
  border-radius:calc(var(--s) * 4);
  background:#fff; color:#0b1220;
  box-shadow:0 1px 2px rgba(8,14,26,.04), 0 14px 30px rgba(8,14,26,.06);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.15;
}

/* fixed budget — the stage (visual) always gets the leftover space */
.mw-head  { flex:none; display:flex; align-items:flex-start; justify-content:space-between; gap:calc(var(--s) * 2); }
.mw-stage { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
.mw-footer{ flex:none; }

.mw-title{ margin:0; font-size:calc(var(--s) * 6); font-weight:850; letter-spacing:-.03em; }
.mw-sub  { margin:calc(var(--s) * .6) 0 0; font-size:calc(var(--s) * 3.2); color:#7d8494; font-weight:500; }
.mw-icon { flex:none; width:calc(var(--s) * 13); aspect-ratio:1; border-radius:50%; display:grid; place-items:center;
  color:#fff; font-weight:850; font-size:calc(var(--s) * 6); background:linear-gradient(145deg,#86e634,#14c94f); }

/* metric (number + unit) */
.mw-metric{ display:flex; align-items:flex-end; gap:calc(var(--s) * 1.4); }
.mw-metric b   { font-size:calc(var(--s) * 16); font-weight:850; letter-spacing:-.06em; line-height:.82; }
.mw-metric span{ font-size:calc(var(--s) * 3.4); color:#7a8192; padding-bottom:calc(var(--s) * .6); font-weight:650; }
.mw-up{ color:#19c85a; font-weight:750; font-size:calc(var(--s) * 3.2); }

/* CHART stage — chart box on top, axis BELOW (so the axis never steals chart height) */
.mw-chartStage{ flex:1; min-height:0; display:grid; grid-template-rows:1fr auto; gap:calc(var(--s) * 1); }
.mw-chartBox{ position:relative; min-height:0; }
.mw-chartBox svg{ position:absolute; inset:0; width:100%; height:100%; }
.mw-axisX{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; font-size:calc(var(--s) * 2.4); color:#7e8492; }
.mw-axisX span{ text-align:center } .mw-axisX span:first-child{ text-align:left } .mw-axisX span:last-child{ text-align:right }

/* GAUGE / DONUT / RING — the container controls the shape via aspect-ratio */
.mw-gauge { width:calc(var(--s) * 64); max-width:100%; aspect-ratio:352/280; position:relative; }
.mw-ring, .mw-liquid{ width:calc(var(--s) * 58); max-width:82%; aspect-ratio:1; position:relative; }
.mw-gauge svg, .mw-ring svg, .mw-liquid svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.mw-center{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; }
.mw-center b    { font-size:calc(var(--s) * 11); font-weight:850; letter-spacing:-.06em; line-height:.85; }
.mw-center small{ display:block; margin-top:calc(var(--s) * 1); font-size:calc(var(--s) * 3); color:#7d8493; font-weight:700; }

/* footer bits */
.mw-note { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:calc(var(--s) * 1.8);
  padding:calc(var(--s) * 2.4); border-radius:calc(var(--s) * 2.4); background:#f4fff8; }
.mw-note b{ display:block; font-size:calc(var(--s) * 3.2); } .mw-note span{ color:#7a8192; font-size:calc(var(--s) * 2.8); }
.mw-split{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:1px solid #e9ebf0; border-radius:calc(var(--s) * 2.4); overflow:hidden; }
.mw-split>div{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--s) * .8); padding:calc(var(--s) * 2) calc(var(--s) * .6); border-right:1px solid #eef0f3; }
.mw-split>div:last-child{ border-right:0 }
.mw-split small{ color:#7e8493; font-size:calc(var(--s) * 2.6); } .mw-split strong{ font-size:calc(var(--s) * 4.4); font-weight:800; }

/* REFLOW VARIANTS — a card can't look right in square, tall AND wide cells unless it
   reflows. Add class "mw-wide" to opt a card into a side-by-side layout when the cell
   is wide; tighten spacing when the cell is very tall/narrow. */
@media (min-aspect-ratio:1.35/1){
  .mw-card.mw-wide{ display:grid; grid-template-columns:1fr 1.3fr; grid-template-rows:auto 1fr; column-gap:calc(var(--s) * 4); }
  .mw-card.mw-wide .mw-head  { grid-column:1; }
  .mw-card.mw-wide .mw-stage { grid-column:2; grid-row:1 / 3; }
  .mw-card.mw-wide .mw-footer{ grid-column:1; align-self:end; }
}
@media (max-aspect-ratio:.8/1){
  .mw-card{ gap:calc(var(--s) * 1.6); }
}
</style>
</head>
<body>

<!-- 1 · METRIC.  head (flex:none) / stage (the number) / footer ─────────────── -->
<section class="mw-card"
  data-widget-id="pack.headcount" data-widget-title="Headcount" data-widget-description="Total active workforce"
  data-widget-icon="fa-users" data-widget-category="Workforce"
  data-widget-size="standard" data-widget-sizes="compact,standard,wide,large">
  <div class="mw-head"><div><h2 class="mw-title">Headcount</h2><p class="mw-sub">Total active workforce</p></div><span class="mw-icon">★</span></div>
  <div class="mw-stage"><div class="mw-metric"><b>248</b><span>people</span></div></div>
  <div class="mw-footer mw-up">↑ 8% vs last month</div>
</section>

<!-- 2 · LINE CHART.  chart stage = chart box + axis below; "mw-wide" reflows when wide -->
<section class="mw-card mw-wide"
  data-widget-id="pack.trend" data-widget-title="Change Trend" data-widget-description="Last 7 days"
  data-widget-icon="fa-chart-line" data-widget-category="Activity"
  data-widget-size="wide" data-widget-sizes="standard,wide,large">
  <div class="mw-head"><div><h2 class="mw-title">Change Trend</h2><p class="mw-sub">Last 7 days</p></div><span class="mw-icon" style="background:linear-gradient(145deg,#be6dff,#7046ee)">⌁</span></div>
  <div class="mw-chartStage">
    <div class="mw-chartBox">
      <svg viewBox="0 0 360 200" preserveAspectRatio="none"><defs><linearGradient id="tFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b58f6" stop-opacity=".22"/><stop offset="1" stop-color="#8b58f6" stop-opacity="0"/></linearGradient></defs>
        <path d="M10 150 L60 110 L110 138 L160 92 L210 120 L260 78 L310 104 L350 56 L350 200 L10 200Z" fill="url(#tFill)"/>
        <path d="M10 150 L60 110 L110 138 L160 92 L210 120 L260 78 L310 104 L350 56" fill="none" stroke="#7a4ff3" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>
    </div>
    <div class="mw-axisX"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  </div>
  <div class="mw-footer"><div class="mw-metric"><b>68</b><span>changes</span></div></div>
</section>

<!-- 3 · GAUGE / DONUT.  aspect-ratio stage + centered value -->
<section class="mw-card"
  data-widget-id="pack.readiness" data-widget-title="Readiness" data-widget-description="Activation readiness"
  data-widget-icon="fa-shield-halved" data-widget-category="Workforce"
  data-widget-size="tall" data-widget-sizes="standard,tall,large">
  <div class="mw-head"><div><h2 class="mw-title">Readiness</h2><p class="mw-sub">Activation readiness</p></div><span class="mw-icon" style="background:linear-gradient(145deg,#4f94ff,#165bd7)">✓</span></div>
  <div class="mw-stage">
    <div class="mw-ring">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#eef2f7" stroke-width="12"/><circle cx="50" cy="50" r="42" fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round" stroke-dasharray="206 264" transform="rotate(-90 50 50)"/></svg>
      <div class="mw-center"><b>78%</b><small>ready</small></div>
    </div>
  </div>
  <div class="mw-footer mw-split"><div><small>Docs</small><strong>84%</strong></div><div><small>Training</small><strong>71%</strong></div><div><small>Access</small><strong>66%</strong></div></div>
</section>

<style>
/* Standalone-preview layout only — the importer reads the <section>s + the shared <style>
   and ignores this grid. Open the file in a browser to preview the cards. */
body{margin:0;background:#e7e7ea;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,360px));grid-auto-rows:380px;gap:22px;padding:24px;justify-content:center}
</style>
</body>
</html>
