<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Module Groups</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  :root {
    --card-bg:      #ffffff;
    --card-border:  #e6e8ee;
    --ink:          #334155;   /* default label */
    --ink-strong:   #1e293b;   /* header title  */
    --icon:         #64748b;   /* default icon  */
    --accent:       #2563eb;   /* active blue   */
    --accent-bg:    #eef3fe;   /* active row bg */
    --badge-bg:     #eef1f5;
    --badge-ink:    #64748b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px;
    background: #f1f3f7;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }

  .module-groups {
    width: 320px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
    padding: 8px;
  }

  /* Header */
  .mg-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 10px;
  }
  .mg-head-ico { font-size: 16px; color: var(--icon); }
  .mg-head-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-strong);
    letter-spacing: -.01em;
  }
  .mg-collapse {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--icon);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  /* List */
  .mg-list { display: flex; flex-direction: column; gap: 2px; }

  .mg-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
    transition: background .12s ease;
  }
  .mg-item:hover { background: #f6f8fb; }

  .mg-item-ico { font-size: 16px; color: var(--icon); width: 20px; text-align: center; }
  .mg-item-label { font-size: 14.5px; font-weight: 500; }

  /* Count badge */
  .mg-badge {
    margin-left: auto;
    min-width: 28px;
    height: 24px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: var(--badge-bg);
    color: var(--badge-ink);
    font-size: 13px;
    font-weight: 600;
  }

  /* Active state */
  .mg-item.active {
    background: var(--accent-bg);
    color: var(--accent);
  }
  .mg-item.active .mg-item-ico { color: var(--accent); }
  .mg-item.active .mg-item-label { font-weight: 600; }
  .mg-item.active::before {
    content: "";
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--accent);
  }
  .mg-item.active .mg-badge {
    background: #ffffff;
    color: var(--accent);
    border: 1px solid #cddcff;
  }
</style>
</head>
<body>

  <div class="module-groups">
    <div class="mg-head">
      <i class="mg-head-ico fa-solid fa-shapes"></i>
      <span class="mg-head-title">Module Groups</span>
      <button class="mg-collapse" aria-label="Collapse"><i class="fa-solid fa-chevron-up"></i></button>
    </div>

    <div class="mg-list">
      <div class="mg-item active">
        <i class="mg-item-ico fa-solid fa-table-cells-large"></i>
        <span class="mg-item-label">All Modules</span>
        <span class="mg-badge">12</span>
      </div>

      <div class="mg-item">
        <i class="mg-item-ico fa-solid fa-user-group"></i>
        <span class="mg-item-label">People &amp; Culture</span>
        <span class="mg-badge">3</span>
      </div>

      <div class="mg-item">
        <i class="mg-item-ico fa-solid fa-briefcase"></i>
        <span class="mg-item-label">Workplace</span>
        <span class="mg-badge">3</span>
      </div>

      <div class="mg-item">
        <i class="mg-item-ico fa-solid fa-scale-balanced"></i>
        <span class="mg-item-label">Finance</span>
        <span class="mg-badge">2</span>
      </div>

      <div class="mg-item">
        <i class="mg-item-ico fa-solid fa-gear"></i>
        <span class="mg-item-label">Operations</span>
        <span class="mg-badge">2</span>
      </div>

      <div class="mg-item">
        <i class="mg-item-ico fa-solid fa-gears"></i>
        <span class="mg-item-label">Systems</span>
        <span class="mg-badge">2</span>
      </div>
    </div>
  </div>

</body>
</html>
