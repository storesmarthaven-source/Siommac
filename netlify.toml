[build]
  # "." serves index.html from the project root; Vite assets land in assets/
  # during Phase 1 (shim mode).  When Phase 7 is complete, change to "dist".
  publish = "."
  functions = "dist/netlify/functions"
  command = "npm install --legacy-peer-deps && npm run build"

[dev]
  # Functions-only dev server on 8888 — Vite runs separately on 5173 and
  # proxies /api/* here. Setting targetPort prevents Netlify Dev from trying
  # to auto-detect and start a second framework process on the same port.
  port = 8888
  functions = "dist/netlify/functions"

[build.environment]
  # Vite 8 requires Node >=20.19.0 or >=22.12.0 — pin to 22 so Netlify's
  # build container satisfies the engine constraint.
  NODE_VERSION = "22"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback for the public invite-accept page (HR Onboarding provisioning) so the
# emailed /set-password?token=… deep link serves index.html in production.
[[redirects]]
  from = "/set-password"
  to = "/index.html"
  status = 200

# ── Security headers — applied to every response ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# ── index.html — must always revalidate so new deploys take effect immediately ─
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ── Service Worker — never cache, browser must check every time ───────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# ── Local JS — long cache, busted by filename change or SW update ─────────────
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

# ── Local CSS ─────────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

# ── app-shell HTML partial ────────────────────────────────────────────────────
[[headers]]
  for = "/assets/partials/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── Static images — short cache so logo updates take effect quickly ───────────
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ── Vite-built assets (hashed filenames — safe to cache forever) ──────────────
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Netlify function — no caching (dynamic API) ───────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
